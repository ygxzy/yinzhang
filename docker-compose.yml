version: "3.8"

services:
  seal-api:
    # GPU 版本（默认）
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: seal-api
    ports:
      - "8000:8000"
    environment:
      - SEAL_CONFIG_PATH=/app/config.yaml
      - SEAL_DEVICE=gpu
      - WORKERS=2
    volumes:
      # 模型缓存（避免每次重启重新下载）
      - seal-models:/root/.paddlex
      # 输出目录（可选，方便查看可视化图）
      - ./output_seal:/app/output_seal
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  seal-models:
